<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YY CLUB · 播客</title>
<meta name="description" content="YY CLUB 播客电台 · 52 期节目在线收听">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='66' font-size='44' font-family='-apple-system,Helvetica' font-weight='700' fill='white' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ══════════ 顶部导航 ══════════ -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">Y</div>
      <div class="brand-text">
        <h1>YY CLUB</h1>
        <p id="brandSub">播客电台</p>
      </div>
    </div>
    <div class="header-tools">
      <div class="search-box">
        <svg viewBox="0 0 20 20" class="search-icon"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.8 12.8 L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="搜索单集" aria-label="搜索单集">
      </div>
      <button class="sort-btn" id="sortBtn" aria-label="切换排序">
        <span id="sortLabel">最新优先</span>
        <svg viewBox="0 0 12 12"><path d="M6 1v10M6 11l-3.5-3.5M6 11l3.5-3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ══════════ 单集列表 ══════════ -->
<main class="episode-list" id="episodeList" role="list" aria-label="单集列表"></main>
<div class="list-empty" id="listEmpty" hidden>没有找到相关单集</div>
<div class="list-footer">YY CLUB · 共 <span id="totalCount">52</span> 期 · 由 GitHub Pages 提供托管</div>

<!-- ══════════ 迷你播放条 ══════════ -->
<div class="mini-player" id="miniPlayer" hidden>
  <div class="mini-progress" id="miniProgress"><i></i></div>
  <button class="mini-art" id="miniArt" aria-label="展开播放器"></button>
  <button class="mini-info" id="miniInfo">
    <span class="mini-title" id="miniTitle"></span>
    <span class="mini-sub" id="miniSub"></span>
  </button>
  <div class="mini-eq" id="miniEq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button class="mini-btn" id="miniPlay" aria-label="播放或暂停">
    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5c-.7-.4-1.6.1-1.6.9z"/></svg>
    <svg class="icon-pause" viewBox="0 0 24 24" style="display:none"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
  </button>
  <button class="mini-btn mini-fwd" id="miniFwd" aria-label="快进 30 秒">
    <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/><text x="12" y="15.2" font-size="6.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">30</text></svg>
  </button>
</div>

<!-- ══════════ 全屏播放器 ══════════ -->
<div class="full-player" id="fullPlayer" hidden>
  <div class="fp-bg" id="fpBg"></div>
  <div class="fp-scroll">
    <div class="fp-handle-area" id="fpHandleArea"><div class="fp-handle"></div></div>

    <div class="fp-art-wrap">
      <div class="fp-art" id="fpArt"></div>
    </div>

    <canvas class="fp-spectrum" id="fpSpectrum" width="640" height="112" aria-hidden="true"></canvas>

    <div class="fp-meta">
      <div class="fp-titles">
        <h2 id="fpTitle"></h2>
        <p id="fpSub"></p>
      </div>
    </div>

    <!-- 进度 -->
    <div class="fp-scrub">
      <input type="range" id="scrubber" min="0" max="1000" value="0" step="1" aria-label="播放进度">
      <div class="fp-times">
        <span id="timeCur">0:00</span>
        <span id="timeRemain">-0:00</span>
      </div>
    </div>

    <!-- 控制 -->
    <div class="fp-controls">
      <button class="ctl-btn" id="btnBack" aria-label="后退 15 秒">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z" transform="scale(-1,1) translate(-24,0)"/><text x="12" y="15.2" font-size="6.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">15</text></svg>
      </button>
      <button class="ctl-btn ctl-play" id="btnPlay" aria-label="播放或暂停">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5c-.7-.4-1.6.1-1.6.9z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" style="display:none"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
      </button>
      <button class="ctl-btn" id="btnFwd" aria-label="快进 30 秒">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/><text x="12" y="15.2" font-size="6.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">30</text></svg>
      </button>
    </div>

    <!-- 音量 / 速度 -->
    <div class="fp-extras">
      <div class="fp-volume" id="fpVolume">
        <svg viewBox="0 0 24 24" class="vol-icon"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="100" aria-label="音量">
        <svg viewBox="0 0 24 24" class="vol-icon"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <button class="rate-btn" id="rateBtn">1×</button>
    </div>

    <!-- 标签页 -->
    <div class="fp-tabs">
      <button class="fp-tab active" data-tab="about">简介</button>
      <button class="fp-tab" data-tab="transcript">字幕</button>
    </div>
    <div class="fp-panel" id="panelAbout">
      <p id="aboutText"></p>
      <p class="about-meta" id="aboutMeta"></p>
    </div>
    <div class="fp-panel" id="panelTranscript" hidden>
      <div class="transcript-list" id="transcriptList"></div>
      <div class="transcript-empty" id="transcriptEmpty" hidden>
        <div class="ts-spinner"></div>
        <p>本期字幕正在由 AI 生成<br><span>稍后刷新页面即可查看</span></p>
      </div>
    </div>
  </div>
  <button class="fp-close" id="fpClose" aria-label="关闭播放器">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</div>

<audio id="audio" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
